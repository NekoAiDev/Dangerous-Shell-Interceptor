# 危险Shell拦截 DSI 配置文件
# 修改后重启模块或重新进入 dsi shell 生效。
# 说明：本文件为示例；模块运行时会将其复制为实际 config.conf。

# 全局拦截总开关: on / off
global.intercept=on

# 各规则开关: on（启用拦截）/ off（放行）
rule.forkbomb=on
rule.dd=on
rule.mkfs=on
rule.rm=on
rule.chmod_chown=on
rule.redirect=on
rule.mv=on
rule.wipe=on
rule.flash=on
rule.selinux=on
rule.mount_rw=on
rule.pm_uninstall=on
rule.curl_pipe=on
rule.kill=on

# 白名单：匹配到的命令将直接放行（子串匹配，区分大小写）
# 用法示例（取消注释生效）:
# allow.*=rm -rf ./build
# allow.*=dd if=/dev/zero of=image.img
